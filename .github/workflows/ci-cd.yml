name: ThingsBoard CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  ci-build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thingsboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: "maven"
      
      - name: Compile and Install Dependencies
        run: >
          mvn clean install 
          -T 1C
          -DskipTests 
          -DskipITs 
          -Dassembly.skipAssembly=true 
          -Dcheckstyle.skip=true 
          -Dlicense.skip=true 
          -Ddockerfile.skip=true 
          -Dmaven.javadoc.skip=true 
          -Dmaven.source.skip=true 
          -B 
          -fae
      
      - name: Run Unit Tests
        run: >
          mvn test 
          -pl "common/message,common/data"
          -Dtest="!**/*IT*,!**/*Integration*,!**/*Performance*,!**/*Load*,!**/*Stress*,!**/*E2E*"
          -DskipITs=true 
          -Dcheckstyle.skip=true 
          -Dlicense.skip=true 
          -Ddockerfile.skip=true
          -B

      - name: Upload JAR File as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thingsboard-jar
          path: application/target/thingsboard-*.jar
          retention-days: 1
  
  cd-docker-push:
    runs-on: ubuntu-latest
    needs: ci-build-test

    steps:
      - name: Chechout Repository
        uses: actions/checkout@v4
      
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: thingsboard-jar
          path: build-output

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and Push Docker Image
        run: |

          echo "FROM amazoncorretto:17" > Dockerfile
          echo "COPY build-output/thingsboard-*.jar app.jar" >> Dockerfile
          echo "ENTRYPOINT [\"java\",\"-jar\",\"/app.jar\"]" >> Dockerfile
          
          IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/thingsboard-log8371:latest"

          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

          echo "Docker image pushed: $IMAGE_TAG"