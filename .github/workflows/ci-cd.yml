name: ThingsBoard CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  ci-build-and-test:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
      - name: Start PostgreSQL Service
        run: |
          docker rm -f thingsboard-db-test || echo "No existing container to remove."
          docker run -d --name thingsboard-db-test -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=thingsboard postgres:15
          echo "Waiting for PostgreSQL to be ready..."
          sleep 10

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: "maven"
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Compile and Install Dependencies
        run: >
          mvn clean install
          -T 1C
          -Dskip.js.executor=true
          -Dyarn.skip=true
          -DskipTests=true 
          -DskipITs=true
          -Dfrontend.skip=true
          -Dassembly.skipAssembly=true 
          -Dcheckstyle.skip=true 
          -Dlicense.skip=true 
          -Ddockerfile.skip=true 
          -B
          -fae
      
      - name: Run Unit Test with Maven
        run: >
          mvn test 
          -pl "application,common/data,common/message,common/transport/mqtt,common/transport/http,common/transport/coap,common/util,common/stats,common/cluster-api,common/cache"
          -DforkCount=1C
          -Dtest="!**/*IT*,!**/*Integration*,!**/*Performance*,!**/*Load*,!**/*Stress*,!**/*Suite*,!**/*E2E*"
          -DskipITs=true 
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dcheckstyle.skip=true 
          -Dlicense.skip=true 
          -Ddockerfile.skip=true
          -B
          -fae

      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f thingsboard-db-test || echo "No existing container to remove."

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thingsboard-build
          path: application/target/
          retention-days: 5
  
  cd-deploy:
    needs: ci-build-and-test
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: thingsboard-build
          path: application/target/

      - name: Start PostgreSQL
        run: |
          docker rm -f thingsboard-db-test || echo "No existing container to remove."
          docker run -d --name thingsboard-db-test -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=thingsboard postgres:15
          echo "Waiting for PostgreSQL to be ready..."
          sleep 10
      
      - name: Install Database Schema
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/thingsboard
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: |
          chmod +x application/target/bin/install/install-dev-db.sh
          cd application/target/bin/install
          ./install-dev-db.sh
      
      - name: Deploy ThingsBoard
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/thingsboard
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          TB_QUEUE_TYPE: in-memory
          TB_ServiCE_TYPE: monolith
          JAVA_TOOL_OPTIONS: "-Xmx4096m"
        run: |
          java -jar application/target/thingsboard-*.jar & > start.log 2>&1 &
          PID=$!
          echo "Waiting for ThingsBoard to start..."
          for i in {1..30}; do
            sleep 10
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login || echo "000")

            if [ "$STATUS" == "200" ] || [ "$STATUS" == "404" ]; then
              echo "ThingsBoard started successfully."
              kill $PID
              docker rm -f thingsboard-db-test || echo "No existing container to remove."
              exit 0
            else
              echo "Waiting for ThingsBoard to start... (Attempt: $i)"
            fi
          done

          echo "ThingsBoard failed to start within the expected time."
          cat start.log
          kill $PID
          docker rm -f thingsboard-db-test || echo "No existing container to remove."
          exit 1