name:  ThingsBoard CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: thingsboard
          POSTGRES_USER: thingsboard
          POSTGRES_PASSWORD: thingsboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: "maven"
      
      - name: Compile and Install Dependencies
        run: >
          mvn clean install 
          -DskipTests=true 
          -DskipITs=true 
          -Dcheckstyle.skip=true 
          -Dlicense.skip=true 
          -Ddockerfile.skip=true 
          -B
      
      - name: Run Unit Test with Maven
        run: >
          mvn test 
          -pl common/data 
          -am 
          -Dtest=!**/*IT 
          -Dtest=!**/*IntegrationTest 
          -DskipITs=true 
          -Dcheckstyle.skip=true 
          -Dlicense.skip=true 
          -Ddockerfile.skip=true 
          -B

      - name: Database Setup
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/thingsboard
          SPRING_DATASOURCE_USERNAME: thingsboard
          SPRING_DATASOURCE_PASSWORD: thingsboard
        run: |
          chmod +x application/target/bin/install/install_dev_db.sh
          cd application/target/bin/install
          ./install_dev_db.sh
      
      - name: Starting and Verify ThingsBoard is running
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/thingsboard
          SPRING_DATASOURCE_USERNAME: thingsboard
          SPRING_DATASOURCE_PASSWORD: thingsboard
        run: |
          echo "Démarrage de ThingsBoard..."
          java -jar application/target/thingsboard-*.jar &
          PID=$!
          
          echo "Attente de disponibilité (Health Check)..."
          for i in {1..18}; do
            sleep 10
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/login)
            if [ "$STATUS" == "200" ]; then
              echo "SUCCÈS : ThingsBoard a démarré et répond !"
              kill $PID
              exit 0
            fi
            echo "Tentative $i/18 : Statut $STATUS - En attente..."
          done
          
          echo "ÉCHEC : Timeout au démarrage."
          kill $PID
          exit 1