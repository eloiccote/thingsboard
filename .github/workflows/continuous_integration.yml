name: ThingsBoard CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Start PostgreSQL Service
        run: |
          docker rm -f thingsboard-db-test || echo "No existing container to remove."
          docker run -d --name thingsboard-db-test -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=thingsboard postgres:15
          echo "Waiting for PostgreSQL to be ready..."
          sleep 10
          
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: "maven"
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Compile and Install Dependencies
        run: >
          mvn clean install 
          -DskipTests=true 
          -DskipITs=true
          -Dfrontend.skip=true
          -Dassembly.skipAssembly=true 
          -Dcheckstyle.skip=true 
          -Dlicense.skip=true 
          -Ddockerfile.skip=true 
          -B
          -fae
      
      - name: Run Unit Test with Maven
        run: >
          mvn test
          -pl !ui-ngx
          -Dtest=!**/*IT 
          -Dtest=!**/*IntegrationTest 
          -DskipITs=true
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dcheckstyle.skip=true 
          -Dlicense.skip=true 
          -Ddockerfile.skip=true
          -B
          -fae

      - name: Database Setup
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/thingsboard
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: |
          sudo mkdir -p /var/log/thingsboard
          sudo chown -R runner:runner /var/log/thingsboard
          sudo chmod 777 /var/log/thingsboard
          chmod +x application/target/bin/install/install_dev_db.sh
          cd application/target/bin/install
          ./install_dev_db.sh
      
      - name: Starting and Verify ThingsBoard is running
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/thingsboard
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          TB_QUEUE_TYPE: in-memory
          TB_SERVICE_TYPE: monolith
          JAVA_TOOL_OPTIONS: "-Xmx4096m" 
        run: |
          sudo mkdir -p /var/log/thingsboard
          sudo chown -R runner:runner /var/log/thingsboard
          sudo chmod 777 /var/log/thingsboard
          
          java -jar application/target/thingsboard-*.jar > start.log 2>&1 &
          PID=$!
          
          echo "Waiting for ThingsBoard to start..."
          for i in {1..40}; do
            sleep 10
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/login || echo "000")
            
            if [ "$STATUS" == "200" || "$STATUS" == "404"]; then
              echo "SUCCESS: ThingsBoard is running."
              kill $PID
              exit 0
            fi
            echo "$i/40 : Statut $STATUS - ThingsBoard is not ready yet."
          done
          
          echo "FAILURE: ThingsBoard did not start within the expected time."
          cat start.log
          kill $PID
          exit 1