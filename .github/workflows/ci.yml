name: CI ThingsBoard

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-test-and-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: thingsboard
          POSTGRES_USER: postgre
          POSTGRES_PASSWORD: postgre
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgre -d thingsboard"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build ThingsBoard and run unit tests
        run: |
          mvn clean test -DskipTests=false

      # --- BONUS : Analyse de maintenabilité (PMD) ---
      - name: Download PMD
        run: |
          curl -L -o pmd.zip https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.0.0/pmd-dist-7.0.0-bin.zip
          unzip -q pmd.zip

      - name: Run PMD complexity analysis
        run: |
          ./pmd-bin-7.0.0/bin/pmd check -d ./ -R pmd-ruleset.xml -f text

      # --- Lancement basique de ThingsBoard (preuve CI) ---
      - name: Start ThingsBoard (smoke run)
        run: |
          mvn spring-boot:run &
          sleep 60
