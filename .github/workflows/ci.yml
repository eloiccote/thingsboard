name: CI Thingsboard

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: thingsboard
          POSTGRES_USER: postgre
          POSTGRES_PASSWORD: postgre
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgre -d thingsboard"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and Test with Maven
        run: mvn -B clean install -pl application -am -DskipTests=false -Dui.skip=true

      - name: Start ThingsBoard
        run: |
          JAR="$(ls application/target/*-boot.jar | head -n 1)"
          echo "Using jar: $JAR"
          nohup java -jar "$JAR" \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/thingsboard \
            --spring.datasource.username=postgre \
            --spring.datasource.password=postgre \
            > tb.log 2>&1 &
          echo $! > tb.pid

      - name: Verify ThingsBoard is running
        run: |
          for i in {1..24}; do
            if curl -fsS http://localhost:8080/ >/dev/nul
