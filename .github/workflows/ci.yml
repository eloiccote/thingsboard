name: CI Thingsboard

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      TZ: UTC
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: thingsboard
          POSTGRES_USER: postgre
          POSTGRES_PASSWORD: postgre
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgre -d thingsboard"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and Test with Maven
        run: |
          mvn -B clean install -pl application -am -DskipTests=false -Dui.skip=true \
            -DargLine="-Duser.language=en -Duser.country=US -Duser.timezone=UTC"

      - name: Start ThingsBoard
        run: |
          JAR="$(ls application/target/*-boot.jar | head -n 1)"
          echo "Using jar: $JAR"
          nohup java -jar "$JAR" \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/thingsboard \
            --spring.datasource.username=postgre \
            --spring.datasource.password=postgre \
            > tb.log 2>&1 &
          echo $! > tb.pid

      - name: Verify ThingsBoard is running
        run: |
          for i in {1..24}; do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              echo "OK: ThingsBoard up"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 5
          done
          echo "FAILED to start. Last logs:"
          tail -n 200 tb.log || true
          exit 1

      - name: Stop ThingsBoard
        if: always()
        run: |
          if [ -f tb.pid ]; then
            kill $(cat tb.pid) || true
          fi

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
